name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and tag
        id: metadata
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" != "v$version" ]]; then
            echo 'Tag must match CFBundleShortVersionString'; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Audit and test
        run: |
          python3 Scripts/check_publication.py
          python3 Scripts/check_localization.py
          bash -n Scripts/*.sh
          swift test --scratch-path .build/Tests
      - name: Build universal ad-hoc signed DMG
        run: bash Scripts/build_release.sh
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 SwiftClip*.dmg > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SwiftClip-${{ steps.metadata.outputs.version }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SwiftClip-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify downloaded assets
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish a new release without replacing old assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Existing releases are never overwritten.'; exit 1
          fi
          cat > release-notes.md <<EOF_NOTES
          Native clipboard history for macOS 13+, with English and Vietnamese UI.

          **Downloads:** SwiftClip$VERSION.dmg (universal Apple Silicon + Intel), SHA256SUMS.

          Drag SwiftClip.app into Applications. Grant Accessibility for Auto Paste; Copy Only works without it.

          **Signing:** ad-hoc signed, not Developer ID signed or notarized. Gatekeeper may require System Settings → Privacy & Security → Open Anyway for this app. Never disable Gatekeeper globally.

          Updating an ad-hoc build may require removing/re-adding its Accessibility entry.

          Built from tag $TAG in [$GITHUB_REPOSITORY Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          See the README for privacy, installation, usage and known limitations.
          EOF_NOTES
          gh release create "$TAG" "dist/SwiftClip$VERSION.dmg" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "SwiftClip $VERSION" --notes-file release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
